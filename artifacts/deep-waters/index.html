<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Deep Waters Montenegro — Canyoning Tours in Nevidio Canyon</title>
    <meta name="description" content="Deep Waters Montenegro — licensed canyoning guides leading small-group tours through Nevidio Canyon. Book your adrenaline-charged adventure for 120€." />
    <meta name="keywords" content="canyoning, Montenegro, Nevidio Canyon, adventure tours, Šavnik, rafting, abseiling" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1B3022" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:site_name" content="Deep Waters Montenegro" />
    <meta property="og:title" content="Deep Waters Montenegro — Canyoning Tours in Nevidio Canyon" />
    <meta property="og:description" content="Licensed canyoning guides leading small-group tours through Nevidio Canyon. 5 years of experience, full gear and insurance included." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deepwaters.me/" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Deep Waters Montenegro canyoning in Nevidio Canyon" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />
    <meta property="og:locale:alternate" content="sr_ME" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deep Waters Montenegro" />
    <meta name="twitter:description" content="Licensed canyoning guides leading small-group tours through Nevidio Canyon." />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <!-- Icons + PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" sizes="32x32" href="/favicon.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Synchronously hide page content if this is the grand-opening first visit.
         Runs before any React paint so there is zero flash of site content. -->
    <script>
      try {
        if (!sessionStorage.getItem("dw_welcome_seen_v2")) {
          document.documentElement.classList.add("grand-opening-active");
        }
      } catch (e) {}
    </script>

    <!-- Google Analytics (placeholder — replace G-XXXXXXXXXX with your real Measurement ID) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: true });
    </script>
  </head>
  <body>
    <!-- Overlay portal root — sibling of #root so CSS opacity on #root does not affect it -->
    <div id="overlay-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
